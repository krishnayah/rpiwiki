name: Sync Outline Content

on:
  schedule:
    - cron: "0 */6 * * *" # Run every 6 hours
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Sync Script
        env:
          OUTLINE_API_KEY: ${{ secrets.OUTLINE_API_KEY }}
          # Optional: Override default URL if set in repository variables
          OUTLINE_URL: ${{ vars.OUTLINE_URL }}
        run: npm run sync

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Check for changes
          if [[ -n $(git status -s) ]]; then
            git add content/ .outline-sync-metadata.json
            git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sync content from Outline" && git push)
          else
            echo "No changes to commit"
          fi
